<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalCart - Create Shipment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --page:#0f0f10; --card:#1b1b1d; --card-soft:#202023; --field:#2a2a2d; --border:#303034; --text:#f5f5f5; --muted:#9a9a9d; --accent:#f5821f; --green:#36c978; --blue:#4d91ff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--page); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .main { width:min(100%,1120px); margin:0 auto; padding:30px 34px 50px; }
    .topbar { display:flex; align-items:center; gap:18px; margin-bottom:30px; }
    .back { width:48px; height:48px; border:1px solid var(--border); border-radius:50%; background:var(--field); color:var(--text); font-size:27px; line-height:1; }
    .back:hover { border-color:var(--accent); color:var(--accent); }
    h1 { margin:0 0 7px; font-size:25px; letter-spacing:-.5px; }
    .intro { margin:0; color:var(--muted); font-size:12px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; }
    .toolbar h2 { margin:0; font-size:14px; }
    .toolbar-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .sort-wrap { position:relative; display:inline-flex; align-items:center; }
    .sort-wrap::after { content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--muted); pointer-events:none; }
    .sort-control { min-width:180px; height:36px; padding:0 28px 0 11px; border:1px solid var(--border); border-radius:7px; background:#111214; color:var(--text); font-size:11px; appearance:none; -webkit-appearance:none; -moz-appearance:none; }
    .sort-control option { background:#111214; color:var(--text); }
    .search { display:flex; align-items:center; gap:8px; width:260px; height:36px; padding:0 11px; border:1px solid var(--border); border-radius:7px; background:var(--field); color:var(--muted); }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--text); font-size:11px; }
    .search input::placeholder { color:var(--muted); }
    .orders { display:grid; gap:10px; }
    .order { overflow:hidden; border:1px solid var(--border); border-radius:9px; background:linear-gradient(145deg,var(--card-soft),var(--card)); }
    .order-header { display:grid; grid-template-columns:100px minmax(145px,1fr) 150px 125px 92px; align-items:center; gap:14px; padding:16px; }
    .order-number { padding:0; border:0; background:transparent; color:var(--accent); font-size:12px; font-weight:700; text-align:left; text-decoration:underline; text-underline-offset:3px; }
    .order-number:hover { color:#ffad68; }
    .customer { font-size:12px; font-weight:600; }
    .customer small, .order-date { display:block; margin-top:4px; color:var(--muted); font-size:10px; font-weight:400; }
    .delivery-cell { display:flex; align-items:center; gap:8px; }
    .delivery-tag { padding:5px 7px; border-radius:5px; font-size:9px; font-weight:700; white-space:nowrap; }
    .ship-button { padding:6px 8px; border:1px solid var(--accent); border-radius:5px; background:transparent; color:var(--accent); font-size:9px; font-weight:700; white-space:nowrap; }
    .ship-button:hover { background:var(--accent); color:#111; }
    .rankdrop { background:rgba(245,130,31,.14); color:var(--accent); }
    .home { background:rgba(77,145,255,.14); color:var(--blue); }
    .status { color:var(--muted); font-size:10px; }
    .order-total { font-size:11px; font-weight:700; text-align:right; }
    .items { display:none; padding:0 16px 16px; border-top:1px solid var(--border); }
    .order.open .items { display:block; }
    .shipment-options { display:none; grid-template-columns:repeat(2,1fr); gap:10px; padding:0 16px 16px; }
    .order.ship-options .shipment-options { display:grid; }
    .shipment-options-title { grid-column:1/-1; margin:14px 0 0; color:var(--muted); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .shipment-option { padding:13px; border:1px solid var(--border); border-radius:7px; background:var(--field); color:var(--text); text-align:left; }
    .shipment-option:hover { border-color:var(--accent); }
    .shipment-option h3 { margin:0 0 6px; font-size:11px; }
    .shipment-option p { margin:0 0 10px; color:var(--muted); font-size:10px; line-height:1.5; }
    .shipment-price { color:var(--accent); font-size:13px; font-weight:700; }
    .items-title { margin:14px 0 9px; color:var(--muted); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .item { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #2a2a2d; color:var(--muted); font-size:11px; }
    .item:last-child { border-bottom:0; }
    .item strong { color:var(--text); font-weight:600; }
    .empty { padding:30px; border:1px solid var(--border); border-radius:9px; background:var(--card); color:var(--muted); text-align:center; font-size:12px; }
    .footer { margin-top:18px; color:var(--muted); font-size:10px; }
    @media (max-width:760px) {
      .main { padding:24px 16px 40px; }
      .toolbar { align-items:stretch; flex-direction:column; }
      .search { width:100%; }
      .order-header { grid-template-columns:1fr 1fr; gap:12px; }
      .delivery-cell { justify-self:start; }
      .shipment-options { grid-template-columns:1fr; }
      .shipment-options-title { grid-column:auto; }
      .order-total { text-align:left; }
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .theme-toggle .icon-moon { display: none; }

    [data-theme="light"] {
      --page: #ffffff;
      --card: #ffffff;
      --card-soft: #fafafa;
      --field: #f2f2f2;
      --border: #d0d0d0;
      --text: #000000;
      --muted: #333333;
    }

    [data-theme="light"] .sort-control,
    [data-theme="light"] .sort-control option { background: #f2f2f2; color: #000000; }
    [data-theme="light"] .item { border-bottom-color: #e0e0e0; }
    [data-theme="light"] .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: inline; }
  </style>
</head>
<body>
  <main class="main">
    <header class="topbar">
      <button class="back" type="button" aria-label="Back to shipments">←</button>
      <div><h1>Create Shipment</h1><p class="intro">Select an unshipped customer order to create a RankDrop shipment.</p></div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark mode"><svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l-1.41-1.41M17.66 6.34l-1.41-1.41"></path></svg><svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg></button>
    </header>

    <section class="toolbar">
      <h2>Unshipped customer orders</h2>
      <div class="toolbar-controls">
        <label class="sort-wrap" aria-label="Order by">
          <select class="sort-control" id="sortOrders">
            <option value="default">List order (default)</option>
            <option value="oldest">Oldest first</option>
            <option value="rankdrop">RankDrop first</option>
            <option value="home">Home Delivery first</option>
          </select>
        </label>
        <label class="search">⌕ <input id="search" type="search" placeholder="Search orders or customers..." aria-label="Search unshipped orders"></label>
      </div>
    </section>

    <section class="orders" id="orders" aria-live="polite"></section>
    <p class="footer">Default ordering is by order number, newest first. Click an order number to view its items.</p>
  </main>

  <script src="sweetalert2.bundle.js"></script>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('localcart-theme');
    if (savedTheme === 'light') document.documentElement.dataset.theme = 'light';
    themeToggle.addEventListener('click', () => {
      const isLight = document.documentElement.dataset.theme === 'light';
      document.documentElement.dataset.theme = isLight ? 'dark' : 'light';
      localStorage.setItem('localcart-theme', isLight ? 'dark' : 'light');
    });

    const orders = [
      { number:1048, customer:'Ayesha Daniels', email:'ayesha@example.com', method:'RankDrop', destination:'Site B Rank', date:'30 May 2024', total:'R849.00', items:[['Wireless earbuds',2,'R399.00'],['USB-C charging cable',1,'R51.00']] },
      { number:1047, customer:'Liam Jacobs', email:'liam@example.com', method:'Home Delivery', destination:'Claremont, Cape Town', date:'30 May 2024', total:'R1,249.00', items:[['Running shoes',1,'R899.00'],['Sports socks',2,'R175.00']] },
      { number:1046, customer:'Nandi Mbeki', email:'nandi@example.com', method:'RankDrop', destination:'Mitchells Plain Rank', date:'29 May 2024', total:'R529.00', items:[['Skincare set',1,'R329.00'],['Cotton face towels',2,'R100.00']] },
      { number:1044, customer:'Daniel Smith', email:'daniel@example.com', method:'Home Delivery', destination:'Rondebosch, Cape Town', date:'29 May 2024', total:'R2,099.00', items:[['Kitchen blender',1,'R1,499.00'],['Measuring cup set',1,'R600.00']] },
      { number:1042, customer:'Thandi Ndlovu', email:'thandi@example.com', method:'RankDrop', destination:'Bellville Taxi Rank', date:'28 May 2024', total:'R679.00', items:[['Denim jacket',1,'R549.00'],['Canvas belt',1,'R130.00']] },
      { number:1039, customer:'Musa Williams', email:'musa@example.com', method:'Home Delivery', destination:'Wyneberg, Cape Town', date:'28 May 2024', total:'R379.00', items:[['Notebook pack',3,'R129.00']] }
    ];
    const orderList = document.getElementById('orders');
    const search = document.getElementById('search');
    const sortOrders = document.getElementById('sortOrders');
    const trackedShipmentsKey = 'localcart-tracked-shipments';

    function getTrackedShipments() {
      return JSON.parse(localStorage.getItem(trackedShipmentsKey) || '[]');
    }

    function getAvailableOrders() {
      const shippedOrderNumbers = new Set(getTrackedShipments().map(shipment => Number(shipment.orderNumber)));
      return orders.filter(order => !shippedOrderNumbers.has(order.number));
    }

    function getSortedOrders() {
      const sorted = [...getAvailableOrders()];
      const sortMode = sortOrders.value;

      if (sortMode === 'oldest') {
        sorted.sort((a, b) => a.number - b.number);
      } else if (sortMode === 'rankdrop') {
        sorted.sort((a, b) => {
          const aRank = a.method === 'RankDrop' ? 0 : 1;
          const bRank = b.method === 'RankDrop' ? 0 : 1;
          if (aRank !== bRank) return aRank - bRank;
          return b.number - a.number;
        });
      } else if (sortMode === 'home') {
        sorted.sort((a, b) => {
          const aRank = a.method === 'Home Delivery' ? 0 : 1;
          const bRank = b.method === 'Home Delivery' ? 0 : 1;
          if (aRank !== bRank) return aRank - bRank;
          return b.number - a.number;
        });
      } else {
        sorted.sort((a, b) => b.number - a.number);
      }

      return sorted;
    }
    function showAlert(title, text) {
      if (typeof Swal !== 'undefined') Swal.fire({ icon:'success', title, text, background:'#1b1b1d', color:'#f5f5f5', confirmButtonColor:'#f5821f' });
      else alert(`${title}\n\n${text}`);
    }
    function render() {
      const query = search.value.trim().toLowerCase();
      const sortedOrders = getSortedOrders();
      const filtered = sortedOrders.filter(order => `${order.number} ${order.customer} ${order.email} ${order.method} ${order.destination}`.toLowerCase().includes(query));
      orderList.innerHTML = filtered.length ? filtered.map(order => `<article class="order"><div class="order-header"><button class="order-number" type="button" data-order="${order.number}">#${order.number}</button><div class="customer">${order.customer}<small>${order.email}</small></div><div class="delivery-cell"><span class="delivery-tag ${order.method === 'RankDrop' ? 'rankdrop' : 'home'}">${order.method}</span><button class="ship-button" type="button" data-ship="${order.number}">Ship Order</button></div><span class="order-date">${order.date}<small>${order.destination}</small></span><strong class="order-total">${order.total}</strong></div><div class="items"><p class="items-title">Ordered items</p>${order.items.map(item => `<div class="item"><span><strong>${item[0]}</strong> × ${item[1]}</span><span>${item[2]}</span></div>`).join('')}</div><div class="shipment-options"><p class="shipment-options-title">Choose a shipment method</p><button class="shipment-option" type="button" data-option="rankdrop" data-order="${order.number}"><h3>RankDrop order collection</h3><p>Send the parcel to a RankDrop pickup location for the customer.</p><span class="shipment-price">R50</span></button><button class="shipment-option" type="button" data-option="self-delivery" data-order="${order.number}"><h3>Vendor self-delivery</h3><p>Deliver the parcel yourself to a RankDrop location.</p><span class="shipment-price">Select location</span></button></div></article>`).join('') : '<div class="empty">No unshipped customer orders match your search.</div>';
    }
    orderList.addEventListener('click', event => {
      const shipButton = event.target.closest('[data-ship]');
      if (shipButton) {
        shipButton.closest('.order').classList.toggle('ship-options');
        return;
      }
      const option = event.target.closest('[data-option]');
      if (option) {
        const order = orders.find(item => item.number === Number(option.dataset.order));
        if (!order) return;

        const trackedShipments = getTrackedShipments();
        if (!trackedShipments.some(shipment => Number(shipment.orderNumber) === order.number)) {
          trackedShipments.unshift({
            id: `RD-${order.number}`,
            orderNumber: order.number,
            order: `#${order.number}`,
            point: option.dataset.option === 'rankdrop' ? order.destination : 'Vendor self-delivery',
            status: 'Processing',
            code: '–',
            date: order.date,
            method: option.dataset.option === 'rankdrop' ? 'RankDrop' : 'Home Delivery'
          });
          localStorage.setItem(trackedShipmentsKey, JSON.stringify(trackedShipments));
        }

        const label = option.dataset.option === 'rankdrop' ? 'RankDrop order collection for R50' : 'Vendor self-delivery to a RankDrop location';
        render();
        showAlert('Shipment option selected', `${label} selected for order #${option.dataset.order}.`);
        return;
      }
      const button = event.target.closest('.order-number');
      if (!button) return;
      const order = button.closest('.order');
      order.classList.toggle('open');
    });
    search.addEventListener('input', render);
    sortOrders.addEventListener('change', render);
    document.querySelector('.back').addEventListener('click', () => { window.location.href = 'deliverytracker.html'; });
    render();
  </script>
</body>
</html>
