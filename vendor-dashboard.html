<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LocalCart for Vendors — Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
    <div class="logo">
      <span class="logo-mark">
        <img src="https://i.ibb.co/LWW04LT/logo.png" alt="LocalCart" width="20" height="20" />
      </span>
      LocalCart <span class="logo-tag">for Vendors</span>
    </div>

    <nav>
      <a href="vendor-dashboard.html" class="active">Dashboard</a>
      <a href="add-product.html">Products</a>
      <a href="deliverytracker.html">Orders</a>
      <a href="subscription.html">Subscribe</a>
    </nav>

    <div class="header-right">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        </svg>
      </button>

      <span class="vendor-name"></span>
      <div class="avatar"></div>
    </div>
  </header>

  <main class="vendor-main">
    <div class="vendor-page-head">
      <div>
        <h1 id="vendor-welcome">Welcome back</h1>
        <p>Here's how your shop is doing</p>
      </div>
      <button class="btn-primary" id="add-product-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add product
      </button>
    </div>

    <div class="vendor-stats" id="vendor-stats"></div>

    <h2 class="section-title">Recent orders</h2>
    <div class="orders-card">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Item</th>
            <th>Status</th>
            <th class="num">Amount</th>
          </tr>
        </thead>
        <tbody id="vendor-orders"></tbody>
      </table>
    </div>

    <!-- Action Buttons Row -->
    <div style="display: flex; gap: 16px; margin-top: 32px; flex-wrap: wrap;">
      <button class="btn-primary" id="overview-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        Overview
      </button>
    </div>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="vendor-dashboard.js"></script>

</body>
</html>
