<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — LocalCart</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">
      <span class="logo-mark">
        <img src="./logo.png" alt="LocalCart" width="18" height="18">
      </span>
      LocalCart
    </div>

    <nav>
      <a href="index.html">Dashboard</a>
      <a href="vendors.html">Vendors</a>
      <a href="users.html" class="active">My Profile</a>
      <a href="#">About</a>
    </nav>

    <div class="header-right">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark mode">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        </svg>
      </button>

      <button class="icon-btn" aria-label="Cart" onclick="window.location.href='cart.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </button>

      <div class="profile-dropdown-wrap">
        <button class="profile-toggle" id="profile-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Open profile menu">
          <div class="avatar">TM</div>
        </button>
        <div class="profile-dropdown" id="profile-dropdown">
          <div class="profile-dropdown-header">
            <div class="avatar">TM</div>
            <div>
              <strong data-profile-name>Thabo Mokoena</strong>
              <span data-profile-email>thabo@example.com</span>
            </div>
          </div>
          <div class="profile-dropdown-links">
            <a href="users.html">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              My Profile
            </a>
            <a href="cart.html">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
              My Orders
            </a>
            <div class="divider"></div>
            <button type="button" class="logout-link">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="profile-hero">
    <div class="profile-card" id="profile-card">
      <div class="profile-avatar-lg" id="profile-avatar-lg"></div>

      <div class="profile-details">
        <!-- View mode -->
        <div class="profile-view-only">
          <h1 id="view-name"></h1>
          <p class="profile-email" id="view-email"></p>
          <div class="profile-field"><label>Location</label><p id="view-location"></p></div>
          <div class="profile-field"><label>Member since</label><p id="view-joined"></p></div>
          <div class="profile-field"><label>Bio</label><p id="view-bio"></p></div>
        </div>

        <!-- Edit mode -->
        <div class="profile-edit-only">
          <div class="profile-field">
            <label for="edit-name">Full name</label>
            <input type="text" id="edit-name" />
          </div>
          <div class="profile-field">
            <label for="edit-email">Email</label>
            <input type="email" id="edit-email" />
          </div>
          <div class="profile-field">
            <label for="edit-location">Location</label>
            <input type="text" id="edit-location" />
          </div>
          <div class="profile-field">
            <label for="edit-bio">Bio</label>
            <textarea id="edit-bio"></textarea>
          </div>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn btn-outline" id="toggle-edit-btn">Edit profile</button>
        <button class="btn btn-primary profile-save-btn" id="save-profile-btn">Save changes</button>
      </div>
    </div>
  </section>

  <section class="profile-following-section">
    <div class="section-heading">
      <h2>Vendors you follow</h2>
      <span class="filter-count" id="following-count"></span>
    </div>
    <div class="vendor-grid" id="following-grid"></div>
  </section>

  <footer class="site-footer">
    <div class="footer-logo">
      <span class="logo-mark">
        <img src="./logo.png" alt="LocalCart" width="18" height="18" />
      </span>
      LocalCart
    </div>

    <nav class="footer-links">
      <a href="index.html">Shop</a>
      <a href="vendors.html">Vendors</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <p class="footer-copy">© 2026 LocalCart. Supporting small South African businesses.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="users.js"></script>
</body>
</html>
