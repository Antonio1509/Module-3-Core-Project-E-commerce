<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - LocalCart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">
        <span class="logo-mark">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
            <path d="M3 6h18"></path>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </span>
        LocalCart
      </div>

      <nav>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Vendors</a>
        <a href="#">About</a>
      </nav>

      <div class="header-right">
        <button
          class="icon-btn"
          id="theme-toggle"
          aria-label="Toggle light and dark mode"
        >
          <svg
            class="icon-sun"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            ></path>
          </svg>
          <svg
            class="icon-moon"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>

        <label class="search-box">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            placeholder="Search…"
            aria-label="Search products"
          />
        </label>

        <button
          class="icon-btn"
          aria-label="Cart"
          onclick="window.location.href = 'cart.html'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path
              d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
            ></path>
          </svg>
        </button>

        <div class="avatar">TM</div>
      </div>
    </header>

    <!-- Checkout Section -->
    <main class="checkout-page">
      <div class="container">
        <h1 class="page-title">Checkout</h1>

        <div class="checkout-content">
          <!-- Checkout Form -->
          <form id="checkoutForm" class="checkout-form">
            <div class="form-section">
              <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline; vertical-align: middle; margin-right: 8px;">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                Delivery address
              </h3>
              <div class="form-group">
                <label for="fullName">Full name</label>
                <input
                  type="text"
                  id="fullName"
                  placeholder="e.g. Thandiwe Mokoena"
                  required
                />
              </div>
              <div class="form-group">
                <label for="streetAddress">Street address</label>
                <input
                  type="text"
                  id="streetAddress"
                  placeholder="e.g. 123 Main Street"
                  required
                />
              </div>
              <div class="form-group">
                <label for="city">City</label>
                <input
                  type="text"
                  id="city"
                  placeholder="e.g. Cape Town"
                  required
                />
              </div>
            </div>

            <div class="form-section">
              <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline; vertical-align: middle; margin-right: 8px;">
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                  <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                Payment method
              </h3>
              <div class="form-group">
                <label for="cardNumber">Card number</label>
                <input
                  type="text"
                  id="cardNumber"
                  placeholder="1234 5678 9012 3456"
                  required
                />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="expiry">MM/YY</label>
                  <input type="text" id="expiry" placeholder="MM/YY" required />
                </div>
                <div class="form-group">
                  <label for="cvc">CVC</label>
                  <input type="text" id="cvc" placeholder="CVC" required />
                </div>
              </div>
            </div>
          </form>

          <!-- Order Summary Sidebar -->
          <div class="order-summary">
            <h3>Order summary</h3>
            <div class="summary-row">
              <span>3 items</span>
              <span>R555.00</span>
            </div>
            <div class="summary-row">
              <span>Delivery</span>
              <span>R60.00</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span class="total-amount">R615.00</span>
            </div>
            <button type="button" id="placeOrderBtn" class="btn-place-order">
              Place order
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-logo">
        <span class="logo-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
            <path d="M3 6h18"></path>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </span>
        LocalCart
      </div>

      <nav class="footer-links">
        <a href="#">Shop</a>
        <a href="#">Vendors</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

      <p class="footer-copy">© 2026 LocalCart. Supporting small South African businesses.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
