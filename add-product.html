<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Product - LocalCart</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ==========================================================
  HEADER (Matches Vendor Dashboard)
  ========================================================== -->
  <header>
    <div class="logo">
      <span class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
          <path d="M3 6h18"></path>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </span>
      LocalCart <span class="logo-tag">for Vendors</span>
    </div>

    <nav>
      <a href="vendor-dashboard.html">Dashboard</a>
      <a href="vendor-dashboard.html">Products</a>
      <a href="vendor-dashboard.html">Orders</a>
      <a href="subscribe.html">Subscribe</a>
    </nav>

    <div class="header-right">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        </svg>
      </button>

      <span class="vendor-name" id="vendor-name">Maya's Kitchen</span>
      <div class="avatar" id="avatar-display">M</div>
    </div>
  </header>

  <!-- ==========================================================
  MAIN CONTENT
  ========================================================== -->
  <main class="add-product-main">
    <div class="page-head">
      <div>
        <a href="vendor-dashboard.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Dashboard
        </a>
        <h1>Add a New Product</h1>
        <p>This will appear in your shop and the LocalCart storefront.</p>
      </div>
    </div>

    <div class="form-card">
      <form id="add-product-form" novalidate>

        <!-- ============================================
        PRODUCT IMAGE
        ============================================ -->
        <div class="form-group">
          <label>Product image</label>
          <div class="image-upload-area" id="image-upload-area">
            <span class="upload-icon">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </span>
            <h4>Upload product photo</h4>
            <p>Click or drag &amp; drop an image (PNG, JPG, WEBP)</p>
            <input type="file" id="product-image" accept="image/png,image/jpeg,image/webp">
            <div class="image-preview" id="image-preview">
              <img id="preview-img" src="" alt="Product preview">
              <button type="button" class="remove-image" id="remove-image">×</button>
            </div>
          </div>
        </div>

        <!-- ============================================
        PRODUCT NAME
        ============================================ -->
        <div class="form-group">
          <label for="product-name">Product name <span class="label-hint">(required)</span></label>
          <input type="text" id="product-name" class="form-control" placeholder="e.g., Honey oat cookies" required maxlength="100">
        </div>

        <!-- ============================================
        CATEGORY & PRICE ROW
        ============================================ -->
        <div class="form-row">
          <div class="form-group">
            <label for="product-category">Category <span class="label-hint">(required)</span></label>
            <select id="product-category" class="form-control" required>
              <option value="">Select category...</option>
              <option value="Food">🍪 Food</option>
              <option value="Beverages">☕ Beverages</option>
              <option value="Handmade">🎨 Handmade</option>
              <option value="Wellness">🧘 Wellness</option>
              <option value="Jewelry">💎 Jewelry</option>
              <option value="Home Decor">🏠 Home Decor</option>
              <option value="Clothing">👗 Clothing</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="product-price">Price (R) <span class="label-hint">(required)</span></label>
            <input type="number" id="product-price" class="form-control" placeholder="0.00" min="0.01" step="0.01" required>
          </div>
        </div>

        <!-- ============================================
        STOCK QTY
        ============================================ -->
        <div class="form-group">
          <label for="product-stock">Stock qty <span class="label-hint">(required)</span></label>
          <input type="number" id="product-stock" class="form-control" placeholder="e.g., 20" min="0" step="1" required>
        </div>

        <!-- ============================================
        DESCRIPTION
        ============================================ -->
        <div class="form-group">
          <label for="product-description">Description <span class="label-hint">(optional)</span></label>
          <textarea id="product-description" class="form-control" placeholder="Describe your product..." maxlength="500" rows="4"></textarea>
          <div class="char-counter">
            <span id="char-count">0</span> / 500
          </div>
        </div>

        <!-- ============================================
        FORM ACTIONS
        ============================================ -->
        <div class="form-actions">
          <button type="submit" class="btn-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Publish Product
          </button>
          <button type="button" class="btn-secondary" id="save-draft-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save as Draft
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- ==========================================================
  TOAST CONTAINER
  ========================================================== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ==========================================================
  JAVASCRIPT
  ========================================================== -->
  <script src="index.js"></script>

</body>
</html>
